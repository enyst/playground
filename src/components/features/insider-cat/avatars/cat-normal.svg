<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SmolPaws cat, alert">
  <defs>
    <radialGradient id="fur-n" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#dfe3ea"/>
      <stop offset="100%" stop-color="#aab2c0"/>
    </radialGradient>
  </defs>
  <!-- ears (neutral, upright) -->
  <path d="M16 22 L14 6 L28 16 Z" fill="url(#fur-n)" stroke="#8b93a3" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M48 22 L50 6 L36 16 Z" fill="url(#fur-n)" stroke="#8b93a3" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M18 18 L17 10 L24 16 Z" fill="#f2b8c6"/>
  <path d="M46 18 L47 10 L40 16 Z" fill="#f2b8c6"/>
  <!-- head -->
  <ellipse cx="32" cy="34" rx="21" ry="19" fill="url(#fur-n)" stroke="#8b93a3" stroke-width="1.5"/>
  <!-- eyes (open, calm) -->
  <ellipse cx="24" cy="33" rx="3.4" ry="4.2" fill="#2b2f38"/>
  <ellipse cx="40" cy="33" rx="3.4" ry="4.2" fill="#2b2f38"/>
  <circle cx="25.1" cy="31.4" r="1.1" fill="#fff"/>
  <circle cx="41.1" cy="31.4" r="1.1" fill="#fff"/>
  <!-- nose + mouth -->
  <path d="M32 38 l-2.2 -1.6 h4.4 Z" fill="#f2b8c6"/>
  <path d="M32 38 v2.4 M32 40.4 q-3 2 -6 0 M32 40.4 q3 2 6 0" fill="none" stroke="#8b93a3" stroke-width="1.2" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M18 36 h-9 M19 40 l-8 2 M46 36 h9 M45 40 l8 2" stroke="#c4cad4" stroke-width="1" stroke-linecap="round"/>
</svg>
