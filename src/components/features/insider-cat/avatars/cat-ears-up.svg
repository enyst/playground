<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SmolPaws cat, perked and working">
  <defs>
    <radialGradient id="fur-u" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#e6ecfa"/>
      <stop offset="100%" stop-color="#9fb0d6"/>
    </radialGradient>
  </defs>
  <!-- ears (tall, perked, straight up) -->
  <path d="M15 20 L12 2 L29 15 Z" fill="url(#fur-u)" stroke="#5f6f96" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M49 20 L52 2 L35 15 Z" fill="url(#fur-u)" stroke="#5f6f96" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M17 16 L15 6 L24 14 Z" fill="#f2b8c6"/>
  <path d="M47 16 L49 6 L40 14 Z" fill="#f2b8c6"/>
  <!-- head -->
  <ellipse cx="32" cy="35" rx="21" ry="19" fill="url(#fur-u)" stroke="#5f6f96" stroke-width="1.5"/>
  <!-- eyes (wide, alert) -->
  <circle cx="24" cy="33" r="5" fill="#fff" stroke="#5f6f96" stroke-width="0.8"/>
  <circle cx="40" cy="33" r="5" fill="#fff" stroke="#5f6f96" stroke-width="0.8"/>
  <circle cx="24.6" cy="33.4" r="3" fill="#2b2f38"/>
  <circle cx="40.6" cy="33.4" r="3" fill="#2b2f38"/>
  <circle cx="25.7" cy="32.1" r="1.1" fill="#fff"/>
  <circle cx="41.7" cy="32.1" r="1.1" fill="#fff"/>
  <!-- nose + mouth -->
  <path d="M32 39 l-2.2 -1.6 h4.4 Z" fill="#f2b8c6"/>
  <path d="M32 39 v2.2 M32 41.2 q-3 2 -6 0 M32 41.2 q3 2 6 0" fill="none" stroke="#5f6f96" stroke-width="1.2" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M18 37 h-9 M19 41 l-8 2 M46 37 h9 M45 41 l8 2" stroke="#c4cad4" stroke-width="1" stroke-linecap="round"/>
</svg>
