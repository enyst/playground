<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SmolPaws cat, sleeping">
  <defs>
    <radialGradient id="fur-s" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#d7dbe2"/>
      <stop offset="100%" stop-color="#a2aab8"/>
    </radialGradient>
  </defs>
  <!-- ears (relaxed, drooped outward) -->
  <path d="M14 24 L8 12 L27 18 Z" fill="url(#fur-s)" stroke="#8b93a3" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M50 24 L56 12 L37 18 Z" fill="url(#fur-s)" stroke="#8b93a3" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- head (settled a touch lower) -->
  <ellipse cx="32" cy="37" rx="21" ry="18" fill="url(#fur-s)" stroke="#8b93a3" stroke-width="1.5"/>
  <!-- eyes (closed, gentle arcs) -->
  <path d="M19 35 q5 4 10 0" fill="none" stroke="#2b2f38" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M35 35 q5 4 10 0" fill="none" stroke="#2b2f38" stroke-width="1.8" stroke-linecap="round"/>
  <!-- nose + soft mouth -->
  <path d="M32 41 l-2 -1.4 h4 Z" fill="#f2b8c6"/>
  <path d="M32 41 v2 M32 43 q-2.5 1.6 -5 0 M32 43 q2.5 1.6 5 0" fill="none" stroke="#8b93a3" stroke-width="1.1" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M18 39 h-9 M19 43 l-8 2 M46 39 h9 M45 43 l8 2" stroke="#c4cad4" stroke-width="1" stroke-linecap="round"/>
  <!-- zzz -->
  <path d="M50 16 h6 l-6 6 h6" fill="none" stroke="#8b93a3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M56 8 h4 l-4 4 h4" fill="none" stroke="#aab2c0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
